<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ศูนย์ดาวน์โหลดไดรเวอร์เครื่องพิมพ์ (Printer Driver Center)</title>
    <!-- โหลด Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลด Font Prompt จาก Google -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-8 px-4 text-center">
        <h1 class="text-3xl font-bold mb-2"> ศูนย์ดาวน์โหลดไดรเวอร์เครื่องพิมพ์</h1>
        <p class="text-blue-100 text-sm">รวบรวมไดรเวอร์ Printer สำหรับดาวน์โหลดภายนอกวงแลน</p>
    </header>

    <!-- Content Container -->
    <main class="max-w-4xl mx-auto p-4 sm:p-6">
        
        <!-- ช่องค้นหา -->
        <div class="mb-6">
            <input type="text" id="searchInput" onkeyup="filterDrivers()" 
                placeholder=" พิมพ์ชื่อรุ่นปริ้นเตอร์ เช่น HP, Canon, Epson..." 
                class="w-full p-3 pl-4 rounded-lg border border-gray-300 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- รายการไดรเวอร์ (ตาราง/การ์ด) -->
        <div class="space-y-4" id="driverList">

            <!-- ตัวอย่างรายการที่ 1: Canon -->
            <div class="driver-card bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-md transition">
                <div>
                    <span class="bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded font-semibold">FujiXerox</span>
                    <h2 class="driver-title text-lg font-bold text-gray-800 mt-1">5335</h2>
                    <p class="text-xs text-gray-500 mt-0.5">รองรับ: Windows 10 / 11 (64-bit)</p>
                </div>
                <!-- วางลิงก์ Google Drive / Cloud ใน href -->
                <a href="https://drive.google.com/drive/folders/1G38AQ6tac98W_QuPTP2YGpidGg6jdcAV?usp=sharing" target="_blank" 
                   class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium text-center transition">
                   ดาวน์โหลด
                </a>
            </div>

            <!-- ตัวอย่างรายการที่ 2: Epson -->
            <div class="driver-card bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-md transition">
                <div>
                    <span class="bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded font-semibold">Xerox3065</span>
                    <h2 class="driver-title text-lg font-bold text-gray-800 mt-1">3065</h2>
                    <p class="text-xs text-gray-500 mt-0.5">รองรับ: Windows 10 / 11 (32/64-bit)</p>
                </div>
                <a href="https://drive.google.com/drive/folders/1NZ28eEDb0IsYWFe7jgjpZLylzYfBiuDs?usp=drive_link" target="_blank" 
                   class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium text-center transition">
                   ดาวน์โหลด
                </a>
            </div>

            <!-- ตัวอย่างรายการที่ 3: HP -->
            <div class="driver-card bg-white p-5 rounded-xl shadow-sm border border-gray-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 hover:shadow-md transition">
                <div>
                    <span class="bg-cyan-100 text-cyan-800 text-xs px-2.5 py-1 rounded font-semibold">HP</span>
                    <h2 class="driver-title text-lg font-bold text-gray-800 mt-1">LaserJet Pro M12a / M12w</h2>
                    <p class="text-xs text-gray-500 mt-0.5">รองรับ: Windows 7 / 10 / 11</p>
                </div>
                <a href="https://drive.google.com/YOUR_FILE_LINK_3" target="_blank" 
                   class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium text-center transition">
                   ดาวน์โหลด
                </a>
            </div>

            <!-- สามารถก๊อปปี้บล็อกด้านบนเพิ่มตามจำนวนรุ่นที่มีได้เลย -->

        </div>
    </main>

    <!-- Script สำหรับฟังก์ชันค้นหา -->
    <script>
        function filterDrivers() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('driver-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('driver-title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
